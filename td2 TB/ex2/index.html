<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Choix de prénom</title>
</head>
<body>
  <h1>Choix de prénom</h1>

  <form action="#" method="post">
    <fieldset>
      <legend>Entrez votre prénom</legend>

      <input type="text" id="prenom" name="prenom" list="liste-prenoms" autofocus>

      <datalist id="liste-prenoms">
        <option value="Gérard">
        <option value="Alain">
        <option value="Albert">
        <option value="Robert">
        <option value="Jean">
        <option value="Zoé">
      </datalist>
    </fieldset>
  </form>
</body>
</html>
