<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Envoi d'un message</title>
</head>
<body>
  <form action="#" method="post">
    <fieldset>
      <legend>Envoi d'un message</legend>

      <p>
        <label for="nom">Votre nom :</label>
        <input type="text" id="nom" name="nom" placeholder="Entrez le texte">
      </p>

      <p>
        <label for="message">Le message:</label>
        <textarea id="message" name="message" placeholder="Entrez le message"></textarea>
      </p>

      <p>
        Pour envoyer :
        <input type="submit" value="Valider">
      </p>
    </fieldset>
  </form>
</body>
</html>
